[project]
name = "texture-vae"
version = "0.1.0"
description = ""
authors = [
    {name = "Tobias Lang", email = "tobias@motesque.com"}
]
readme = "README.md"
requires-python = ">=3.7,<3.13"
dependencies = [
    "torch>=2",
    "torchvision>=0.14.0",
    "tqdm>=4.64.1",
    "tensorboard>=2.11.0",
    "torchsummary>=1.5.1",
    "pytest>=7.2.0",
    "click>=8.1.3",
    "onnx>=1.12.0",
    "onnxruntime>=1.13.1",
    "pyyaml>=6.0",
    "matplotlib>=3.5",
    "setuptools>=65.5.0",
]

[project.optional-dependencies]
dev = [
    "isort>=5.10.1",
    "black>=22.10.0",
    "jupyterlab>=3.5.0",
]

[project.scripts]
vae-crop-gen = "texture_vae.cli.crop_gen:create_image_crops"
vae-onnx = "texture_vae.utils.export_onnx:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["texture_vae"]

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310']

[tool.isort]
profile = "black"
